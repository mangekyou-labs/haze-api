# Base Sepolia zk-prepaid gateway.
# Secrets are set separately with `fly secrets set`.

app = "zk-credits-gateway"
primary_region = "iad"

[build]
  dockerfile = "ts/Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  ZK_PREPAID_CIRCUIT_ID = "private-credit-spend-bn254-dev"
  ZK_PREPAID_VERIFYING_KEY_ID = "private-credit-spend-vk-dev"
  ZK_PREPAID_REQUIREMENTS_VERSION = "zk-prepaid-v1"

[[services]]
  protocol = "tcp"
  internal_port = 3001

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = false

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"
