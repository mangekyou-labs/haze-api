# Local Base/x402 development. The web app runs on the host for Next HMR.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zk_credits_dev
      POSTGRES_DB: zk_credits
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zk_credits"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: ts/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:zk_credits_dev@postgres:5432/zk_credits
      PORT: "3001"
      NODE_ENV: development
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      BASE_PRIVATE_CREDIT_BOND_ADDRESS: "${BASE_PRIVATE_CREDIT_BOND_ADDRESS:-}"
      BASE_DEPLOYMENT_DOMAIN: "${BASE_DEPLOYMENT_DOMAIN:-84532}"
      BASE_SPONSOR_PRIVATE_KEY: "${BASE_SPONSOR_PRIVATE_KEY:-}"
      BASE_TREASURY_ADDRESS: "${BASE_TREASURY_ADDRESS:-}"
      BILLING_INTERNAL_TOKEN: "${BILLING_INTERNAL_TOKEN:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
