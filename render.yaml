# Render blueprint for the Base Sepolia zk-prepaid gateway.
#
# Production must use a managed Postgres instance, protected Base sponsor and
# Stripe keys, and a durable worker/reconciliation process. The free plan is
# suitable only for integration testing because instances and databases sleep.

services:
  - type: web
    name: zk-credits-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ts/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zk-credits-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: BASE_RPC_URL
        sync: false
      - key: BASE_PRIVATE_CREDIT_BOND_ADDRESS
        sync: false
      - key: BASE_DEPLOYMENT_DOMAIN
        sync: false
      - key: BASE_SPONSOR_PRIVATE_KEY
        sync: false
      - key: BASE_TREASURY_ADDRESS
        sync: false
      - key: ZK_PREPAID_VERIFYING_KEY_PATH
        value: /app/circuits/private_credit_spend/verification_key.json
      - key: ZK_PREPAID_CIRCUIT_ID
        value: private-credit-spend-bn254-dev
      - key: ZK_PREPAID_VERIFYING_KEY_ID
        value: private-credit-spend-vk-dev
      - key: ZK_PREPAID_REQUIREMENTS_VERSION
        value: zk-prepaid-v1
      - key: BILLING_INTERNAL_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_GATEWAY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

databases:
  - name: zk-credits-db
    plan: free
    region: singapore
    databaseName: zk_credits
    user: zk_credits
