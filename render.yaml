# Render blueprint for the Base Sepolia zk-prepaid gateway.
#
# The pilot runs on free tiers. A free web instance suspends after inactivity,
# so the first request after a suspension pays a cold start. That is accepted
# explicitly rather than paid away:
#
#   - `npm run activation:start` prewarms `/health` with bounded retries, then
#     requires a fully ready `/ready` before it issues an invite, so an
#     operator never meets a suspended instance; and
#   - the `Deploy Smoke` workflow retries every positive probe.
#
# There is deliberately no Render database here. The durable Postgres is an
# external free Neon database reached over its **direct** TLS connection, not
# the pooled endpoint, so this blueprint must not declare `databases:` and must
# not interpolate `fromDatabase`. `DATABASE_URL` is set in the dashboard.
#
# Secrets are never stored here. Every `sync: false` entry is set in the Render
# dashboard. Real payment is out of scope for this pilot, so no Stripe variable
# appears in this blueprint.

services:
  - type: web
    name: zk-credits-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ts/Dockerfile
    dockerContext: .
    # Liveness only. Readiness lives at /ready and is deliberately allowed to
    # report 503 while the launch is paused.
    healthCheckPath: /health
    envVars:
      # Direct Neon TLS connection string, set in the dashboard. Never the
      # `-pooler` host: the claim store owns its own transaction boundaries.
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_GATEWAY_URL
        sync: false
      # ─── Base Sepolia ───────────────────────────────────────────────
      # A dedicated Alchemy Base Sepolia RPC, not the public endpoint.
      - key: BASE_RPC_URL
        sync: false
      - key: BASE_PRIVATE_CREDIT_BOND_ADDRESS
        sync: false
      - key: BASE_DEPLOYMENT_DOMAIN
        sync: false
      # The block the bond was deployed at. The indexer starts here, so an
      # unset or stale value either scans the whole chain history or misses
      # every BundleFunded event.
      - key: BASE_DEPLOYMENT_BLOCK
        sync: false
      - key: BASE_SPONSOR_PRIVATE_KEY
        sync: false
      - key: BASE_TREASURY_ADDRESS
        sync: false
      - key: BASE_CONFIRMATIONS
        value: "3"
      # ─── Pinned proving material ────────────────────────────────────
      - key: ZK_PREPAID_VERIFYING_KEY_PATH
        value: /app/circuits/private_credit_spend/verification_key.json
      - key: ZK_PREPAID_CIRCUIT_ID
        value: private-credit-spend-bn254-dev
      - key: ZK_PREPAID_VERIFYING_KEY_ID
        value: private-credit-spend-vk-dev
      - key: ZK_PREPAID_REQUIREMENTS_VERSION
        value: zk-prepaid-v1
      # ─── Service tokens ─────────────────────────────────────────────
      # BILLING_INTERNAL_TOKEN guards the pilot control plane, the launch admin
      # commands, activation status, and aggregate status.
      # FACILITATOR_SERVICE_TOKEN guards the mutating facilitator endpoints.
      # CLAIM_STORE_OPERATOR_TOKEN guards the operator-only dispatch-budget
      # reset.
      - key: BILLING_INTERNAL_TOKEN
        sync: false
      - key: FACILITATOR_SERVICE_TOKEN
        sync: false
      - key: CLAIM_STORE_OPERATOR_TOKEN
        sync: false
      # ─── Upstream provider ──────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      # ─── Optional error monitoring ──────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
