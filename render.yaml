# Render Blueprint for the Stellar testnet gateway.
#
# This is intentionally a demo/testnet deployment:
# - Free web services sleep after inactivity.
# - Free Postgres is ephemeral/limited and should not hold production data.
#
# Both services use the same database because gateway billing and fee-relay
# idempotency are durable concerns. The fee-sponsor is a public web service
# on the free plan; the gateway only sends transaction XDR to it, never card
# or Stripe data.

services:
  - type: web
    name: zk-credits-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ts/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zk-credits-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: DEFAULT_EPOCH_QUOTA
        value: "100"
      - key: PRICE_PER_CALL_USDC
        value: "1000"
      - key: SPEND_WORKER_INTERVAL_MS
        value: "10000"
      - key: FEE_SPONSOR_URL
        value: https://zk-credits-fee-sponsor.onrender.com
      - key: GATEWAY_SECRET_KEY
        sync: false
      - key: GATEWAY_ADDRESS
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: ZK_CONTRACT_ID
        sync: false
      - key: USDC_CONTRACT_ID
        sync: false
      - key: USDC_ISSUER
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: zk-credits-fee-sponsor
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/fee-sponsor/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zk-credits-db
          property: connectionString
      - key: PORT
        value: "3002"
      - key: NODE_ENV
        value: production
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: ZK_CONTRACT_ID
        sync: false
      - key: FEE_SPONSOR_SECRET_KEY
        sync: false

databases:
  - name: zk-credits-db
    plan: free
    region: singapore
    databaseName: zk_credits
    user: zk_credits
