name: Deploy Smoke

# Hosted health smoke for the Base Sepolia gateway and web app. It is safe to
# schedule before deployment secrets exist: each probe is skipped when its URL
# is not configured.
#
# The gateway runs on a free instance, so a suspended dyno answers the first
# request with a transport error or a platform 5xx. Every positive probe goes
# through `retry_curl`, which retries that cold start instead of reporting a
# deployment defect.
#
# Two optional inputs tighten the run:
#   vars.SMOKE_STRICT_READY      '1' requires /ready to answer 200 with every
#                                check ok. Unset, a 503 is tolerated because
#                                the launch may legitimately be paused.
#   vars.BASE_DEPLOYMENT_BLOCK   requires the indexed block to be at or after
#                                the recorded deployment block. Needs
#                                secrets.BILLING_INTERNAL_TOKEN to read the
#                                authenticated aggregate status.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Hosted Base/x402 health smoke
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      WEB_URL: ${{ secrets.WEB_URL }}
      BILLING_INTERNAL_TOKEN: ${{ secrets.BILLING_INTERNAL_TOKEN }}
      SMOKE_STRICT_READY: ${{ vars.SMOKE_STRICT_READY }}
      BASE_DEPLOYMENT_BLOCK: ${{ vars.BASE_DEPLOYMENT_BLOCK }}
      SMOKE_ATTEMPTS: ${{ vars.SMOKE_ATTEMPTS || '12' }}
      SMOKE_RETRY_DELAY: ${{ vars.SMOKE_RETRY_DELAY || '5' }}
    steps:
      - name: Prepare the cold-start probe helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/smoke.sh" <<'HELPER'
          # Cold-start aware probe helper for a free-tier instance.
          SMOKE_ATTEMPTS="${SMOKE_ATTEMPTS:-12}"
          SMOKE_RETRY_DELAY="${SMOKE_RETRY_DELAY:-5}"

          # retry_curl <curl args...> retries a transport error or an HTTP error
          # status, which is how a suspended instance presents itself.
          retry_curl() {
            local attempt
            for attempt in $(seq 1 "$SMOKE_ATTEMPTS"); do
              if curl -sS --max-time 30 "$@"; then return 0; fi
              echo "  attempt $attempt/$SMOKE_ATTEMPTS failed; retrying in ${SMOKE_RETRY_DELAY}s" >&2
              sleep "$SMOKE_RETRY_DELAY"
            done
            echo "  probe failed after $SMOKE_ATTEMPTS attempts" >&2
            return 1
          }

          # status_of <method> <url> prints only the HTTP status. Negative
          # probes assert on the status, so this one does not retry.
          status_of() {
            local method="$1" url="$2"
            shift 2
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X "$method" "$@" "$url"
          }
          HELPER

      - name: Gateway health and readiness
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          # This probe doubles as the prewarm for every later probe.
          retry_curl -fsS "$GATEWAY_URL/health" | grep -q '"status":"ok"'

          ready=$(retry_curl -sS -w '\n%{http_code}' "$GATEWAY_URL/ready")
          status=$(printf '%s' "$ready" | tail -n1)
          body=$(printf '%s' "$ready" | sed '$d')
          echo "GET /ready -> $status"
          test "$status" != "404"
          printf '%s' "$body" | grep -q '"launchControl"'
          printf '%s' "$body" | grep -q '"checks"'

          if [ "${SMOKE_STRICT_READY:-0}" = "1" ]; then
            echo "strict readiness is on: /ready must be 200 with every check ok"
            test "$status" = "200"
            printf '%s' "$body" | grep -q '"ready":true'
            # Every reported check must be ok: a single false is a defect.
            if printf '%s' "$body" | jq -e '[.checks[] | select(.ok != true)] | length == 0' >/dev/null; then
              echo "all readiness checks ok"
            else
              echo "readiness reported failing checks:" >&2
              printf '%s' "$body" | jq -r '.checks[] | select(.ok != true) | "  \(.name): \(.detail)"' >&2
              exit 1
            fi
          else
            echo "strict readiness is off; a 503 paused report is tolerated"
          fi
      - name: Gateway indexing starts at the recorded deployment block
        if: env.GATEWAY_URL != '' && env.BILLING_INTERNAL_TOKEN != '' && env.BASE_DEPLOYMENT_BLOCK != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          status=$(retry_curl -fsS -w '\n%{http_code}' \
            -H "Authorization: Bearer $BILLING_INTERNAL_TOKEN" \
            -H 'Accept: application/json' \
            "$GATEWAY_URL/v1/admin/status")
          code=$(printf '%s' "$status" | tail -n1)
          body=$(printf '%s' "$status" | sed '$d')
          echo "GET /v1/admin/status -> $code"
          test "$code" = "200"
          last=$(printf '%s' "$body" | jq -r '.base.lastScannedBlock // ""')
          echo "deployment block: $BASE_DEPLOYMENT_BLOCK, last scanned block: ${last:-none}"
          test -n "$last"
          # The indexer must have reached the deployment block; scanning less
          # means no BundleFunded event can be observed yet.
          test "$last" -ge "$BASE_DEPLOYMENT_BLOCK"
      - name: Gateway supported schemes
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          retry_curl -fsS "$GATEWAY_URL/x402/facilitator/supported" | grep -q 'zk-prepaid'
      - name: Web landing renders
        if: env.WEB_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          retry_curl -fsS "$WEB_URL" | grep -q 'ZK API Credits'
      - name: Removed web payment routes return 404
        if: env.WEB_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          for probe in \
            "POST /api/checkout" \
            "POST /api/webhooks/stripe" \
            "GET /api/orders/ord_000000000000" \
            "GET /api/wallet/link?address=0x0000000000000000000000000000000000000001"; do
            method="${probe%% *}"
            path="${probe#* }"
            status=$(status_of "$method" "$WEB_URL$path")
            echo "$method $path -> $status"
            test "$status" = "404"
          done
      - name: Removed gateway billing and wallet-link APIs return 404
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          for probe in \
            "POST /v1/billing/orders" \
            "GET /v1/billing/orders/ord_000000000000" \
            "POST /v1/billing/stripe-event" \
            "POST /v1/accounts/wallet-link"; do
            method="${probe%% *}"
            path="${probe#* }"
            status=$(status_of "$method" "$GATEWAY_URL$path" -H 'Content-Type: application/json' -d '{}')
            echo "$method $path -> $status"
            test "$status" = "404"
          done
      - name: Pilot pages render no checkout or payment action
        if: env.WEB_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          # Anonymous dashboard access must be gated by GitHub sign-in.
          gated=$(status_of GET "$WEB_URL/dashboard")
          echo "anonymous GET /dashboard -> $gated"
          test "$gated" != "200"
          for path in /sign-in /onboarding /recover; do
            body=$(retry_curl -fsSL "$WEB_URL$path")
            echo "$path rendered"
            if printf '%s' "$body" | grep -qiE 'stripe|/api/checkout|buy credits|checkout\.sessions'; then
              echo "$path still advertises a checkout or payment path" >&2
              exit 1
            fi
          done
      - name: Retired Stellar and evaluation gateway routes return 404
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          for probe in \
            "POST /v1/evaluation/enroll" \
            "GET /v1/evaluation/status" \
            "POST /v1/evaluation/challenge" \
            "POST /v1/evaluation/deposit" \
            "GET /v1/deposits" \
            "POST /v1/withdraw" \
            "POST /v1/slash" \
            "GET /v1/membership-tree" \
            "POST /v1/fee-relay" \
            "GET /v1/api-keys"; do
            method="${probe%% *}"
            path="${probe#* }"
            status=$(status_of "$method" "$GATEWAY_URL$path" -H 'Content-Type: application/json' -d '{}')
            echo "$method $path -> $status"
            test "$status" = "404"
          done
      - name: No generic x402 rail, public facilitator, Bazaar, or MCP surface
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          for path in \
            "/x402/exact/verify" \
            "/x402/exact/settle" \
            "/x402/settle" \
            "/x402/facilitator/bazaar" \
            "/x402/bazaar" \
            "/mcp" \
            "/v1/mcp"; do
            status=$(status_of POST "$GATEWAY_URL$path" -H 'Content-Type: application/json' -d '{}')
            echo "POST $path -> $status"
            test "$status" = "404"
          done
          # The only mutating facilitator operation is service-authenticated.
          settle=$(status_of POST "$GATEWAY_URL/x402/facilitator/settle" -H 'Content-Type: application/json' -d '{}')
          echo "POST /x402/facilitator/settle -> $settle"
          test "$settle" = "401"
      - name: Unsupported OpenAI and Anthropic routes stay unavailable
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          # /v1/responses is recognised but never serves a paid path.
          responses=$(curl -sS -D "$RUNNER_TEMP/responses.headers" -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"model":"x","messages":[{"role":"user","content":"hi"}]}' \
            "$GATEWAY_URL/v1/responses")
          echo "POST /v1/responses -> $responses"
          test "$responses" = "400"
          if grep -qi '^payment-required:' "$RUNNER_TEMP/responses.headers"; then
            echo '/v1/responses advertised a payment challenge' >&2
            exit 1
          fi
          for path in "/v1/models" "/v1/messages" "/v1/embeddings"; do
            status=$(status_of POST "$GATEWAY_URL$path" -H 'Content-Type: application/json' -d '{}')
            echo "POST $path -> $status"
            test "$status" = "404"
          done
      - name: Pilot invite and funding endpoints exist
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/smoke.sh"
          # The routes exist when the gateway answers anything but 404. Invalid
          # input yields 400 and an unconfigured store yields 503; both prove
          # the route is mounted.
          funding=$(status_of POST "$GATEWAY_URL/v1/pilot/funding" -H 'Content-Type: application/json' -d '{}')
          echo "POST /v1/pilot/funding -> $funding"
          test "$funding" != "404"
          # An unfunded but well-formed commitment legitimately answers 404, so
          # probe with a value the route can only reject when it is mounted.
          bundle=$(status_of GET "$GATEWAY_URL/v1/pilot/bundles/not-a-field")
          echo "GET /v1/pilot/bundles/not-a-field -> $bundle"
          test "$bundle" = "400"
