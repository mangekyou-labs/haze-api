name: Deploy Smoke

# Hosted health smoke for the Base Sepolia gateway and web app. It is safe to
# schedule before deployment secrets exist: each probe is skipped when its URL
# is not configured.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Hosted Base/x402 health smoke
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      WEB_URL: ${{ secrets.WEB_URL }}
    steps:
      - name: Gateway health and readiness
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          curl -fsS "$GATEWAY_URL/health" | grep -q '"status":"ok"'
          # Readiness may legitimately report 503 while the launch is paused, so
          # this probe asserts the route is mounted and answers with a report.
          ready=$(curl -sS -w '\n%{http_code}' "$GATEWAY_URL/ready")
          status=$(printf '%s' "$ready" | tail -n1)
          body=$(printf '%s' "$ready" | sed '$d')
          echo "GET /ready -> $status"
          test "$status" != "404"
          printf '%s' "$body" | grep -q '"launchControl"'
          printf '%s' "$body" | grep -q '"checks"'
      - name: Gateway supported schemes
        if: env.GATEWAY_URL != ''
        run: curl -fsS "$GATEWAY_URL/x402/facilitator/supported" | grep -q 'zk-prepaid'
      - name: Web landing renders
        if: env.WEB_URL != ''
        run: curl -fsS "$WEB_URL" | grep -q 'ZK API Credits'
      - name: Removed web payment routes return 404
        if: env.WEB_URL != ''
        run: |
          set -euo pipefail
          for probe in \
            "POST /api/checkout" \
            "POST /api/webhooks/stripe" \
            "GET /api/orders/ord_000000000000" \
            "GET /api/wallet/link?address=0x0000000000000000000000000000000000000001"; do
            method="${probe%% *}"
            path="${probe#* }"
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$WEB_URL$path")
            echo "$method $path -> $status"
            test "$status" = "404"
          done
      - name: Removed gateway billing and wallet-link APIs return 404
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          for probe in \
            "POST /v1/billing/orders" \
            "GET /v1/billing/orders/ord_000000000000" \
            "POST /v1/billing/stripe-event" \
            "POST /v1/accounts/wallet-link"; do
            method="${probe%% *}"
            path="${probe#* }"
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" -H 'Content-Type: application/json' -d '{}' "$GATEWAY_URL$path")
            echo "$method $path -> $status"
            test "$status" = "404"
          done
      - name: Pilot pages render no checkout or payment action
        if: env.WEB_URL != ''
        run: |
          set -euo pipefail
          # Anonymous dashboard access must be gated by GitHub sign-in.
          gated=$(curl -sS -o /dev/null -w '%{http_code}' "$WEB_URL/dashboard")
          echo "anonymous GET /dashboard -> $gated"
          test "$gated" != "200"
          for path in /sign-in /onboarding /recover; do
            body=$(curl -fsSL "$WEB_URL$path")
            echo "$path rendered"
            if printf '%s' "$body" | grep -qiE 'stripe|/api/checkout|buy credits|checkout\.sessions'; then
              echo "$path still advertises a checkout or payment path" >&2
              exit 1
            fi
          done
      - name: Retired Stellar and evaluation gateway routes return 404
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          for probe in \
            "POST /v1/evaluation/enroll" \
            "GET /v1/evaluation/status" \
            "POST /v1/evaluation/challenge" \
            "POST /v1/evaluation/deposit" \
            "GET /v1/deposits" \
            "POST /v1/withdraw" \
            "POST /v1/slash" \
            "GET /v1/membership-tree" \
            "POST /v1/fee-relay" \
            "GET /v1/api-keys"; do
            method="${probe%% *}"
            path="${probe#* }"
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" -H 'Content-Type: application/json' -d '{}' "$GATEWAY_URL$path")
            echo "$method $path -> $status"
            test "$status" = "404"
          done
      - name: No generic x402 rail, public facilitator, Bazaar, or MCP surface
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          for path in \
            "/x402/exact/verify" \
            "/x402/exact/settle" \
            "/x402/settle" \
            "/x402/facilitator/bazaar" \
            "/x402/bazaar" \
            "/mcp" \
            "/v1/mcp"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$GATEWAY_URL$path")
            echo "POST $path -> $status"
            test "$status" = "404"
          done
          # The only mutating facilitator operation is service-authenticated.
          settle=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$GATEWAY_URL/x402/facilitator/settle")
          echo "POST /x402/facilitator/settle -> $settle"
          test "$settle" = "401"
      - name: Unsupported OpenAI and Anthropic routes stay unavailable
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          # /v1/responses is recognised but never serves a paid path.
          responses=$(curl -sS -D /tmp/responses.headers -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"model":"x","messages":[{"role":"user","content":"hi"}]}' "$GATEWAY_URL/v1/responses")
          echo "POST /v1/responses -> $responses"
          test "$responses" = "400"
          if grep -qi '^payment-required:' /tmp/responses.headers; then
            echo '/v1/responses advertised a payment challenge' >&2
            exit 1
          fi
          for path in "/v1/models" "/v1/messages" "/v1/embeddings"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$GATEWAY_URL$path")
            echo "POST $path -> $status"
            test "$status" = "404"
          done
      - name: Pilot invite and funding endpoints exist
        if: env.GATEWAY_URL != ''
        run: |
          set -euo pipefail
          # The routes exist when the gateway answers anything but 404. Invalid
          # input yields 400 and an unconfigured store yields 503; both prove
          # the route is mounted.
          funding=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$GATEWAY_URL/v1/pilot/funding")
          echo "POST /v1/pilot/funding -> $funding"
          test "$funding" != "404"
          # An unfunded but well-formed commitment legitimately answers 404, so
          # probe with a value the route can only reject when it is mounted.
          bundle=$(curl -sS -o /dev/null -w '%{http_code}' "$GATEWAY_URL/v1/pilot/bundles/not-a-field")
          echo "GET /v1/pilot/bundles/not-a-field -> $bundle"
          test "$bundle" = "400"
