name: CI

on:
  push:
    branches: [feature-base-zk-credits, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x402:
    name: x402 zk-prepaid package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/x402-zk-prepaid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: packages/x402-zk-prepaid/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  shared:
    name: Shared Base crypto package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zk-credits-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: packages/zk-credits-shared/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  gateway:
    name: Gateway (Base/x402)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Build shared package dependency
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - name: Build x402 package dependency
        working-directory: packages/x402-zk-prepaid
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  sidecar:
    name: Base zk-prepaid sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zk-credits-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: packages/zk-credits-sidecar/package-lock.json
      - name: Build shared package dependency
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - name: Build x402 package dependency
        working-directory: packages/x402-zk-prepaid
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npm pack --dry-run

  launch:
    name: Pilot launch tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      # The operator-side measurement and the secret-boundary guardrails are
      # what stand between an operator and a wasted activation, and the operator
      # machine has no TypeScript toolchain, so they run on their own.
      - name: Operator evidence and handoff guardrails
        run: |
          node --test scripts/operator-evidence.test.mjs
          bash scripts/guardrails.test.sh
      - name: Wizard syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done

  web:
    name: Web (Base/Stripe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build shared package dependency
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:e2e

  circuits:
    name: BN254 private-credit circuit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: circuits/package-lock.json
      - run: npm ci
      - name: Install Circom 2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -L https://github.com/iden3/circom/releases/download/v2.2.2/circom-linux-amd64 -o "$HOME/.local/bin/circom"
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/circom" --version
      - run: npm test -- --run

  contract:
    name: PrivateCreditBond (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: FOUNDRY_OFFLINE=true forge build
      - run: FOUNDRY_OFFLINE=true forge test
