name: CI

on:
  push:
    branches: [feature-stellar-launch, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (ts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Build @zk-credits/shared package (file dep needs dist before typecheck)
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Coverage
        run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-coverage
          path: ts/coverage
          retention-days: 14

  shared:
    name: Shared package (packages/zk-credits-shared)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zk-credits-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/zk-credits-shared/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  sidecar:
    name: Proof-aware sidecar (packages/zk-credits-sidecar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zk-credits-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/zk-credits-sidecar/package-lock.json
      - name: Install Linux keytar runtime
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - name: Build @zk-credits/shared package (file dependency)
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run

  fee-sponsor:
    name: Fee-sponsor service (services/fee-sponsor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fee-sponsor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/fee-sponsor/package-lock.json
      - name: Install fee-sponsor deps
        run: npm ci
      - name: Install gateway deps (fee-sponsor type-checks the shared ts/ sources via @gateway/*)
        working-directory: ts
        run: npm ci
      - name: Build @zk-credits/shared package (file dep needs dist before typecheck)
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - name: Typecheck
        run: npm run typecheck
      # Behavior tests for the fee-relay (method gate, idempotency, fee-only
      # authority) live in ts/ and run in the Gateway job.

  web:
    name: Web (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build @zk-credits/shared package (file dep needs dist before typecheck)
        working-directory: packages/zk-credits-shared
        run: npm ci && npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E smoke
        # The Playwright webServer runs `npm run build && npm run start`, so
        # `next build` is validated as part of this step.
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  circuits:
    name: Circuits (circom + snarkjs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: circuits/package-lock.json
      - name: Install
        run: npm ci
      - name: Off-chain prove + verify
        run: node scripts/test.js

  contract:
    name: Soroban contract (zk-credits-contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zk-credits-contract
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk-credits-contract
      - name: Contract unit tests
        run: cargo test
